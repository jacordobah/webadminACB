# ACB_Web_RP: unica entrada al panel administrativo.
server_tokens off;
resolver 127.0.0.11 valid=10s ipv6=off;

limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_status 429;

log_format edge '$remote_addr "$request" status=$status upstream=$upstream_status destino=$upstream_addr';

server {
    listen 80;
    client_max_body_size 21m;
    access_log /var/log/nginx/access.log edge;

    set $panel http://acb-web-fe:3000;

    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP         $remote_addr;

    location = /bff/v1/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass $panel;
    }

    location / {
        proxy_pass $panel;
    }
}
