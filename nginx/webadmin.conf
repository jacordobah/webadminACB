server_tokens off;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_status 429;
log_format edge '$remote_addr "$request" status=$status upstream=$upstream_status destino=$upstream_addr';

server {
    listen 443 ssl;
    server_name localhost web-tls;
    ssl_certificate /run/acb-tls/webadmin.crt;
    ssl_certificate_key /run/acb-tls/webadmin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    proxy_ssl_trusted_certificate /run/acb-tls/ca.crt;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 2;
    proxy_ssl_server_name on;
    proxy_ssl_name localhost;
    client_max_body_size 21m;
    access_log /var/log/nginx/access.log edge;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_read_timeout 30s;

    location = /bff/v1/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass https://127.0.0.1:3000;
    }

    location / {
        proxy_pass https://127.0.0.1:3000;
    }
}
