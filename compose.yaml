name: acb-dashboard

services:
  redis:
    image: redis:7.4.5-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--port", "0", "--tls-port", "6379", "--tls-cert-file", "/run/acb-tls/redis-sessions.crt", "--tls-key-file", "/run/acb-tls/redis-sessions.key", "--tls-ca-cert-file", "/run/acb-tls/ca.crt", "--tls-auth-clients", "no"]
    volumes:
      - redis-data:/data
      - ${ACB_TLS_DIR:?Set external ACB_TLS_DIR}/redis-sessions.crt:/run/acb-tls/redis-sessions.crt:ro
      - ${ACB_TLS_DIR:?Set external ACB_TLS_DIR}/redis-sessions.key:/run/acb-tls/redis-sessions.key:ro
      - ${ACB_TLS_DIR:?Set external ACB_TLS_DIR}/ca.crt:/run/acb-tls/ca.crt:ro
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--tls", "--cacert", "/run/acb-tls/ca.crt", "-h", "redis", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  bff:
    build:
      context: .
      dockerfile: apps/bff/Dockerfile
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: "3001"
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://localhost:8280}
      BFF_TLS_CERT_FILE: /run/acb-tls/bff.crt
      BFF_TLS_KEY_FILE: /run/acb-tls/bff.key
      AUTH_BASE_URL: https://api-gateway:5062
      ADMIN_USERS_BASE_URL: https://api-gateway:5062
      GEO_BASE_URL: https://api-gateway:5062
      NODE_EXTRA_CA_CERTS: /run/acb-tls/ca.crt
      REDIS_URL: rediss://redis:6379
      SESSION_SIGNING_SECRET: ${SESSION_SIGNING_SECRET:?Generate a 48-byte base64url secret}
      SESSION_ENCRYPTION_KEY: ${SESSION_ENCRYPTION_KEY:?Generate a 32-byte base64url key}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-3600}
      UPSTREAM_TIMEOUT_MS: ${UPSTREAM_TIMEOUT_MS:-8000}
      TRUSTED_PROXY: ${TRUSTED_PROXY:-172.16.0.0/12}
    volumes:
      - type: bind
        source: ${ACB_TLS_DIR:?Set external ACB_TLS_DIR}/bff.crt
        target: /run/acb-tls/bff.crt
        read_only: true
      - type: bind
        source: ${ACB_TLS_DIR:?Set external ACB_TLS_DIR}/bff.key
        target: /run/acb-tls/bff.key
        read_only: true
      - type: bind
        source: ${ACB_TLS_DIR:?Set external ACB_TLS_DIR}/ca.crt
        target: /run/acb-tls/ca.crt
        read_only: true
    networks:
      - default
      - acb-net
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('https://localhost:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ACB_Web_RP: unica entrada HTTPS al panel; Next.js comparte su red local.
  web-tls:
    image: nginx:1.30.5-alpine3.24
    container_name: acb_web_rp
    ports:
      - "${WEB_PORT:-8280}:443"
    volumes:
      - ./nginx/webadmin.conf:/etc/nginx/conf.d/default.conf:ro
      - ${ACB_TLS_DIR:?Set external ACB_TLS_DIR}/webadmin.crt:/run/acb-tls/webadmin.crt:ro
      - ${ACB_TLS_DIR:?Set external ACB_TLS_DIR}/webadmin.key:/run/acb-tls/webadmin.key:ro
      - ${ACB_TLS_DIR:?Set external ACB_TLS_DIR}/ca.crt:/run/acb-tls/ca.crt:ro
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        BFF_INTERNAL_URL: https://bff:3001
    environment:
      HOSTNAME: 127.0.0.1
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://localhost:8280}
      BFF_INTERNAL_URL: https://bff:3001
      NODE_EXTRA_CA_CERTS: /run/acb-tls/ca.crt
      NEXT_TLS_CERT_FILE: /run/acb-tls/next.crt
      NEXT_TLS_KEY_FILE: /run/acb-tls/next.key
    volumes:
      - ${ACB_TLS_DIR:?Set external ACB_TLS_DIR}/ca.crt:/run/acb-tls/ca.crt:ro
      - ${ACB_TLS_DIR:?Set external ACB_TLS_DIR}/next.crt:/run/acb-tls/next.crt:ro
      - ${ACB_TLS_DIR:?Set external ACB_TLS_DIR}/next.key:/run/acb-tls/next.key:ro
    network_mode: service:web-tls
    depends_on:
      bff:
        condition: service_healthy
      web-tls:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('https://localhost:443/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Optional public HTTPS URL through a Cloudflare quick tunnel. The URL appears
  # in `docker compose logs tunnel`; no origin configuration is needed because
  # the BFF accepts each request's own forwarded origin.
  tunnel:
    image: cloudflare/cloudflared:2026.9.3
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --url https://web-tls:443 --origin-ca-pool /run/acb-tls/ca.crt
    volumes:
      - ${ACB_TLS_DIR:?Set external ACB_TLS_DIR}/ca.crt:/run/acb-tls/ca.crt:ro
    depends_on:
      - web-tls
    restart: unless-stopped

volumes:
  redis-data:

networks:
  acb-net:
    external: true
    name: acb-net
