name: acb-dashboard

services:
  redis:
    image: redis:7.4.5-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  bff:
    build:
      context: .
      dockerfile: apps/bff/Dockerfile
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: "3001"
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      AUTH_BASE_URL: https://api-gateway:5062
      ADMIN_USERS_BASE_URL: https://api-gateway:5062
      GEO_BASE_URL: https://api-gateway:5062
      NODE_EXTRA_CA_CERTS: /run/acb-tls/ca.crt
      REDIS_URL: redis://redis:6379
      SESSION_SIGNING_SECRET: ${SESSION_SIGNING_SECRET:?Generate a 48-byte base64url secret}
      SESSION_ENCRYPTION_KEY: ${SESSION_ENCRYPTION_KEY:?Generate a 32-byte base64url key}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-3600}
      UPSTREAM_TIMEOUT_MS: ${UPSTREAM_TIMEOUT_MS:-8000}
      TRUSTED_PROXY: ${TRUSTED_PROXY:-172.16.0.0/12}
    volumes:
      - type: bind
        source: ${ACB_TLS_DIR:?Set external ACB_TLS_DIR}/ca.crt
        target: /run/acb-tls/ca.crt
        read_only: true
    networks:
      - default
      - acb-net
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        BFF_INTERNAL_URL: http://bff:3001
    ports:
      - "${WEB_PORT:-8080}:3000"
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      BFF_INTERNAL_URL: http://bff:3001
    depends_on:
      bff:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Optional public HTTPS URL through a Cloudflare quick tunnel. The URL appears
  # in `docker compose logs tunnel`; no origin configuration is needed because
  # the BFF accepts each request's own forwarded origin.
  tunnel:
    image: cloudflare/cloudflared:2026.9.3
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --url http://web:3000
    depends_on:
      - web
    restart: unless-stopped

volumes:
  redis-data:

networks:
  acb-net:
    external: true
    name: acb-net
